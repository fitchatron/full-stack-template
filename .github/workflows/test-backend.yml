name: test-backend
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
jobs:
  test_backend:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.10"

      - name: Generate .env file
        env:
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          POSTGRES_USER: ${{ secrets.POSTGRES_USER }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          POSTGRES_DB: ${{ vars.POSTGRES_DB }}
        run: |

          rm -f .env
          touch .env

          echo '# Backend' >> .env
          echo "PROJECT_NAME=${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/}" >> .env
          printf 'SECRET_KEY=%s\n' "$SECRET_KEY" >> .env
          echo "FIRST_SUPERUSER=test-not-a-secret@email.com" >> .env
          echo "FIRST_SUPERUSER_PASSWORD=test-user-password" >> .env
          echo '' >> .env
          echo '# Postgres' >> .env
          printf 'POSTGRES_USER=%s\n' "$POSTGRES_USER" >> .env
          printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD" >> .env
          printf 'POSTGRES_DB=%s\n' "$POSTGRES_DB" >> .env
          urlencode() { python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$1"; }
          printf 'DATABASE_URL=postgresql+psycopg://%s:%s@localhost:5432/%s\n' "$(urlencode "$POSTGRES_USER")" "$(urlencode "$POSTGRES_PASSWORD")" "$POSTGRES_DB" >> .env

          echo '' >> .env

      - name: Start docker containers
        run: |
          docker compose -f compose.yml --env-file .env up -d --wait

      - name: Run linter
        run: |
          cd backend
          uv run --group dev ruff check .

      - name: Run FastAPI tests
        run: |
          cd backend
          uv run --group dev -m cli.main test run
      
      - name: Shutdown docker containers
        if: ${{ always() }}
        run: |
          docker compose -f compose.yml down -v

      - name: Clean up
        if: ${{ always() }}
        run: |
          rm -f .env
