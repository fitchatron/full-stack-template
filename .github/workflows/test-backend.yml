name: test-backend
on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
jobs:
  test_backend:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - uses: actions/checkout@v7
      - name: Install uv
        uses: astral-sh/setup-uv@v10.3.0
        with:
          version: "0.12.10"

      # Throwaway Postgres container and test-only key: nothing here is a
      # secret, so the job needs nothing from the GitHub environment.
      - name: Generate .env file
        env:
          SECRET_KEY: test-only-secret-key-not-used-outside-ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test-only-password
          POSTGRES_DB: app
          POSTGRES_HOST: localhost
          POSTGRES_PORT: 5432
        run: |

          rm -f .env
          touch .env

          echo '# Backend' >> .env
          echo "FASTAPI_ENV=development" >> .env
          echo "PROJECT_NAME=${GITHUB_REPOSITORY#$GITHUB_REPOSITORY_OWNER/}" >> .env
          printf 'SECRET_KEY=%s\n' "$SECRET_KEY" >> .env
          echo "FIRST_SUPERUSER=test-not-a-secret@email.com" >> .env
          echo "FIRST_SUPERUSER_PASSWORD=test-user-password" >> .env
          echo '' >> .env
          echo '# Postgres' >> .env
          printf 'POSTGRES_USER=%s\n' "$POSTGRES_USER" >> .env
          printf 'POSTGRES_PASSWORD=%s\n' "$POSTGRES_PASSWORD" >> .env
          printf 'POSTGRES_DB=%s\n' "$POSTGRES_DB" >> .env
          printf 'POSTGRES_HOST=%s\n' "$POSTGRES_HOST" >> .env
          urlencode() { python3 -c 'import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=""))' "$1"; }
          printf 'DATABASE_URL=postgresql+psycopg://%s:%s@%s:%s/%s\n' "$(urlencode "$POSTGRES_USER")" "$(urlencode "$POSTGRES_PASSWORD")" "$(urlencode "$POSTGRES_HOST")" "$POSTGRES_PORT" "$POSTGRES_DB" >> .env

          echo '' >> .env

      - name: Start docker containers
        run: |
          docker compose -f compose.yml --env-file .env up -d --wait

      - name: Run linter
        run: |
          cd backend
          uv run --group dev ruff check .

      - name: Run FastAPI tests
        run: |
          cd backend
          uv run --group dev -m cli.main test run
      
      - name: Shutdown docker containers
        if: ${{ always() }}
        run: |
          docker compose -f compose.yml down -v

      - name: Clean up
        if: ${{ always() }}
        run: |
          rm -f .env
