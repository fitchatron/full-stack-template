name: deploy
on:
  workflow_dispatch:
  push:
    branches:
      - main
    # Same pattern as create-release. Path filters don't apply to tags.
    tags:
      - "*.*.*"
    paths:
      - backend/**
      - nginx/**
      - compose.prod.yml
      - .github/**

jobs:
  set_environment:
    uses: ./.github/workflows/set-environment.yml

  test_backend:
    needs: set_environment
    uses: ./.github/workflows/test-backend.yml
    with:
      environment: ${{ needs.set_environment.outputs.environment }}
    secrets: inherit

  deploy_app:
    needs: [set_environment, test_backend]
    permissions:
      contents: write
    uses: ./.github/workflows/deploy-app.yml
    with:
      environment: ${{ needs.set_environment.outputs.environment }}
    secrets: inherit
