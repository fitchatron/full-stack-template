name: full-stack-template
services:
  backend:
    container_name: backend
    build:
      context: backend
      dockerfile: Dockerfile
    restart: always
    expose:
      - 8000
    env_file:
      - .env

  nginx:
    image: nginx:stable-alpine3.24
    container_name: nginx-proxy
    depends_on:
      - backend
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    #   - ./nginx/conf.d:/etc/nginx/conf.d:ro
    environment:
      - NGINX_PORT=80
