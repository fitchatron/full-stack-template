name: full-stack-template
services:
  backend:
    image: ghcr.io/fitchatron/fst-backend:latest
    container_name: backend
    build:
      context: backend
      dockerfile: Dockerfile
    restart: always
    expose:
      - 8000
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}

  nginx:
    image: ghcr.io/fitchatron/fst-nginx-proxy:latest
    container_name: nginx-proxy
    build:
      context: nginx
      dockerfile: Dockerfile
    depends_on:
      - backend
    restart: always
    # ports:
    #   - "80:80"
    #   - "443:443"
    environment:
      - NGINX_PORT=80
