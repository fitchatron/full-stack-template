name: full-stack-template
services:
  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    restart: always
    expose:
      - 8000
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3

  nginx:
    build:
      context: nginx
      dockerfile: Dockerfile
    depends_on:
      backend:
        condition: service_healthy
    restart: always
