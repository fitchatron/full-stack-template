name: full-stack-template
services:
  backend:
    build:
      context: backend
      dockerfile: Dockerfile
    restart: always
    expose:
      - 8000
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:5432/${POSTGRES_DB}

  nginx:
    build:
      context: nginx
      dockerfile: Dockerfile
    depends_on:
      - backend
    restart: always
    environment:
      - NGINX_PORT=80
