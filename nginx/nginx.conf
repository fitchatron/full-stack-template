worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include mime.types;

  # Traefik is the only thing that reaches nginx (it has no published port),
  # over a Docker network, so trust it for the real client address.
  set_real_ip_from 10.0.0.0/8;
  set_real_ip_from 172.16.0.0/12;
  set_real_ip_from 192.168.0.0/16;
  real_ip_header X-Forwarded-For;

  # Traefik terminates TLS, so nginx itself only ever sees http.
  map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
  }

  upstream app_backend {
    server backend:8000;
  }

  server {
    listen 80;
    server_name localhost;

    # container healthcheck; answers without touching the backend
    location = /nginx-health {
      access_log off;
      return 200 "ok\n";
    }

    # forward api request to backend container
    location ~* ^/(docs|api)(/|$) {
      proxy_pass http://app_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
      # Set, not passed through, so callers can't add their own.
      proxy_set_header X-Forwarded-For $remote_addr;
      proxy_set_header X-Forwarded-Proto $forwarded_proto;
    }
  }
}