worker_processes 1;

events {
  worker_connections 1024;
}

http {
  include mime.types;

  upstream app_backend {
    server backend:8000;
  }

  server {
    listen 80;
    server_name localhost;

    # forward api request to backend container
    location ~* ^/(docs|api) {
      proxy_pass http://app_backend;
      proxy_set_header Host $host;
      proxy_set_header X-Real-IP $remote_addr;
    }
  }
}