name: full-stack-template
services:
  db:
    image: postgres:18
    # restart: always vs unless-stopped
    # always will also restart the container after a manual docker stop
    # unless-stopped is usually what's wanted for a dev db.
    restart: unless-stopped
    shm_size: 128mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 10s
      retries: 5
      start_period: 30s
      timeout: 10s
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - app-db-data:/var/lib/postgresql
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Variable not set}
      POSTGRES_DB: ${POSTGRES_DB:-app}

  redis:
    image: redis:8
    restart: always
    mem_limit: 2G
    volumes:
      - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
      - redis-data:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    environment:
      REDISCLI_AUTH: ${REDIS_PASSWORD:?Variable not set}
    command: >
      redis-server /usr/local/etc/redis/redis.conf
      --requirepass ${REDIS_PASSWORD:?Variable not set}
    healthcheck:
      test: timeout 5 redis-cli -h localhost ping | grep -q PONG || exit 1
      interval: 1s
      timeout: 10s
      retries: 10
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.34
    restart: unless-stopped
    ports:
      - "${MAILPIT_SMTP_PORT:-1025}:1025"
      - "${MAILPIT_UI_PORT:-8025}:8025"
    healthcheck:
      test: nc -z 127.0.0.1 8025 || exit 1
      interval: 3s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  app-db-data:
  redis-data:
