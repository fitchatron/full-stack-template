[project]
name = "app"
version = "0.0.1"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "fitchatron", email = "53107122+fitchatron@users.noreply.github.com" }
]
requires-python = ">=3.14,<4.0"
dependencies = [
    "alembic>=1.19.2,<1.20.0",
    "fastapi[standard]>=0.141.1,<1.0.0",
    "psycopg[binary]>=3.3.5,<3.4.0",
    "pwdlib[argon2,bcrypt]>=0.3.1,<0.4.0",
    "pyjwt>=2.13.0",
    "sqlalchemy>=2.0.52,<2.1.0",
    "typer>=0.27.2,<0.28.0",
]

[dependency-groups]
prod = []
dev = [
    "faker>=40.38.0",
    "ruff>=0.16.6,<0.17.0",
]

[tool.ruff]
target-version = "py314"
exclude = ["alembic"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "ARG001", # unused arguments in functions
    "T201",   # print statements are not allowed
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "W191",  # indentation contains tabs
    "B904",  # Allow raising exceptions without from e, for HTTPException
]

[tool.ruff.lint.pyupgrade]
# Preserve types, even if a file imports `from __future__ import annotations`.
keep-runtime-typing = true

[tool.fastapi]
entrypoint = "app.main:app"
