# Redis config — currently used as the Celery broker.
# The password is NOT set here; it's passed via --requirepass in compose.yml
# from the REDIS_PASSWORD env var so it never gets committed.

# --- Network ---------------------------------------------------------------
bind 0.0.0.0
port 6379
protected-mode yes
tcp-keepalive 60
# Never drop idle clients: Celery workers hold long-lived connections.
timeout 0

# --- Memory ----------------------------------------------------------------
# Keep well below the container's mem_limit (2G) to leave room for
# fork-based persistence (AOF rewrite / RDB snapshot).
maxmemory 1gb
# Broker data must never be evicted: a full Redis should reject writes
# (Celery surfaces the error) rather than silently drop queued tasks.
# When Redis is later shared with a cache, either keep this and set TTLs
# on cache keys (and use volatile-lru), or run the cache as a separate DB/instance.
maxmemory-policy noeviction

# --- Persistence -----------------------------------------------------------
# Queued tasks should survive a restart.
dir /data
appendonly yes
appendfilename "appendonly.aof"
# fsync once per second: at most ~1s of writes lost on a crash.
appendfsync everysec
# Periodic RDB snapshots as a compact backup alongside the AOF.
save 3600 1 300 100 60 10000

# --- Logging / diagnostics -------------------------------------------------
loglevel notice
logfile ""
slowlog-log-slower-than 10000
slowlog-max-len 128
